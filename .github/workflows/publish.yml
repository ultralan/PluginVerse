name: publish

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-runtime
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build
        env:
          PLUGINVERSE_PUBLIC_BASE_URL: ${{ vars.PLUGINVERSE_PUBLIC_BASE_URL || format('https://raw.githubusercontent.com/{0}/{1}/published', github.repository_owner, github.event.repository.name) }}
          PLUGINVERSE_SUPABASE_URL: ${{ vars.PLUGINVERSE_SUPABASE_URL || 'https://ovxaymldzdiatllhjbvx.supabase.co' }}
          PLUGINVERSE_SUPABASE_ANON_KEY: ${{ secrets.PLUGINVERSE_SUPABASE_ANON_KEY || 'sb_publishable_H3ea5scu5VwoJAkA6ZDQtA_WTj-Eycq' }}
          PLUGINVERSE_BUILD_VERSION: 0.1.${{ github.run_number }}

      - name: Verify
        run: pnpm run verify

      - name: Record build
        run: pnpm run record-build
        env:
          PLUGINVERSE_SUPABASE_URL: ${{ vars.PLUGINVERSE_SUPABASE_URL }}
          PLUGINVERSE_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.PLUGINVERSE_SUPABASE_SERVICE_ROLE_KEY }}
          GITHUB_SHA: ${{ github.sha }}

      - name: Publish runtime branch
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          rm -rf .publish
          mkdir .publish
          cp -R dist/. .publish/
          touch .publish/.nojekyll
          cd .publish
          git init
          git checkout -b published
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "发布 PluginVerse 运行时 ${GITHUB_SHA}"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" published
